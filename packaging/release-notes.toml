# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.7.1"

[locales."en-us"]
whats-new = """
The Apple Watch app now keeps itself current. It asks your iPhone for fresh \
mail, meetings, and presence each time you raise your wrist to it, and every \
five minutes while it stays open, so you no longer have to tap refresh.

As always, Blick talks only to Microsoft. No backend, no analytics, no \
third-party SDKs.
"""
