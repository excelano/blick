# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.8.0"

[locales."en-us"]
whats-new = """
Your Apple Watch can now work on its own. Turn it on in Settings with Sign in \
on Apple Watch, and the watch signs in to Microsoft itself. When your iPhone \
is out of reach, it refreshes your meetings, mail, chats, and presence, opens \
and replies to messages, flags and marks them read, and changes your status \
directly. It stays off until you sign the watch in, and you can remove it \
from Settings at any time.

As always, Blick talks only to Microsoft. No backend, no analytics, no \
third-party SDKs.
"""
