# What this release tells the App Store it changed. The version is checked
# against the release being cut, so notes left from last time stop the release
# rather than reaching the listing.

version = "1.9.0"

[locales."en-us"]
whats-new = """
Blick can now show time as Bogenzeit, solar time read from the Sun's arc. \
Turn on Use Bogenzeit in Settings, and meeting times, the countdown to your \
next meeting, and the age of your mail and chats read in spans or \
kiloseconds before or after solar noon or solar midnight where you are. It \
is off until you turn it on, uses only your approximate location, and keeps \
that location on your iPhone. Choose spans or kiloseconds, how precise the \
readings are, and whether clock time stays alongside them.

As always, Blick talks only to Microsoft. No backend, no analytics, no \
third-party SDKs.
"""
